# CircleCI configuration for leverj/nginx-alpine
#
# Builds and publishes the image on every push to master AND on a weekly
# schedule. The scheduled rebuild is the important part: the Dockerfile uses
# unpinned `apk add`, so a periodic rebuild keeps all OS packages current and
# prevents the image from accumulating CVEs (which is what tanked the Docker
# Scout grade to F when the image sat un-rebuilt since 2022).
#
# Required project env vars (Project Settings > Environment Variables):
#   DOCKER_USER  - Docker Hub username
#   DOCKER_PASS  - Docker Hub access token (use a token, not the account password)
#
# Tagging: every build publishes `latest` plus a dated tag (YYYYMMDD) so there
# is always a fresh, pullable, immutable snapshot.
version: 2.1

jobs:
  build-and-push:
    docker:
      - image: cimg/base:current
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - run:
          name: Compute image tag
          # Persist the date tag so later steps in this job can reuse it.
          command: echo "export DATE_TAG=$(date +%Y%m%d)" >> "$BASH_ENV"
      - run:
          name: Build & push with SBOM + SLSA provenance attestations
          # buildx (docker-container driver) attaches build-time SBOM and
          # provenance attestations to the pushed image — required by Docker
          # Scout's "supply chain attestations" health-score policy. Attestations
          # can only be exported on push, so build and push are one step.
          command: |
            echo "$DOCKER_PASS" | docker login -u "$DOCKER_USER" --password-stdin
            docker buildx create --use --name attest-builder >/dev/null 2>&1 || docker buildx use attest-builder
            docker buildx build \
              --provenance=mode=max \
              --sbom=true \
              -t leverj/nginx-alpine:latest \
              -t "leverj/nginx-alpine:${DATE_TAG}" \
              --push \
              .
            docker logout

workflows:
  # Build on every push to master.
  build-on-commit:
    jobs:
      # DOCKER context provides DOCKER_USER / DOCKER_PASS for the push step.
      - build-and-push:
          context: [DOCKER]
          filters:
            branches:
              only:
                - master

  # Rebuild weekly so OS packages stay patched even with no code changes.
  # Mondays at 06:00 UTC.
  weekly-rebuild:
    triggers:
      - schedule:
          cron: "0 6 * * 1"
          filters:
            branches:
              only:
                - master
    jobs:
      - build-and-push:
          context: [DOCKER]
