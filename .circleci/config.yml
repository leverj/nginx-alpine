# CircleCI configuration for leverj/nginx-alpine
#
# Checks only; publishing is performed separately by an authenticated caller.
version: 2.1

jobs:
  checks:
    # Runs on the Alpine release the Dockerfile pins and installs the pinned
    # packages straight into this job container. No image is built.
    docker:
      - image: alpine:3.24
    steps:
      - run:
          name: Install checkout and lint tools
          command: apk add --no-cache git openssh-client shellcheck
      - checkout
      - run:
          name: Job runs the Alpine release the Dockerfile pins
          command: |
            want="$(sed -n 's/^ARG ALPINE_VERSION=//p' Dockerfile)"
            have="$(cut -d. -f1,2 /etc/alpine-release)"
            [ "$want" = "$have" ] || { echo "Dockerfile pins Alpine $want but this job runs $have; bump both together" >&2; exit 1; }
      - run:
          name: Pinned nginx packages still resolve
          # Alpine drops superseded revisions, so this fails once a newer nginx
          # ships on the branch: bump NGINX_VERSION, then publish.
          command: |
            v="$(sed -n 's/^ARG NGINX_VERSION=//p' Dockerfile)"
            apk add --no-cache "nginx=$v" "nginx-mod-http-headers-more=$v" "nginx-mod-http-image-filter=$v"
            nginx -V
      - run:
          name: nginx -t with this repo's nginx.conf
          command: |
            cp nginx.conf /etc/nginx/nginx.conf
            nginx -t
      - run:
          name: shellcheck
          command: |
            shellcheck scripts/docker-publish.sh
            shellcheck --severity=error run.sh

workflows:
  checks-on-commit:
    jobs:
      - checks

  # Replaces the old weekly rebuild + push: the pin check above turns a new
  # Alpine nginx revision into a failed build here instead of a silent image.
  # Mondays at 06:00 UTC.
  weekly-check:
    triggers:
      - schedule:
          cron: "0 6 * * 1"
          filters:
            branches:
              only:
                - master
    jobs:
      - checks
